name: Checks
on:
  push:
    paths-ignore:
      - README.md
      - docs/testing.md
      - docs/progress.md
      - docs/deployment.json
      - docs/qa/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/testing.md
      - docs/progress.md
      - docs/deployment.json
      - docs/qa/**
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec playwright install --with-deps chromium
      # Keep CI to two focused rendering cases and one complete eight-player
      # relay game; the full 2/6/8-player suites remain available manually.
      - run: pnpm exec playwright test tests/browser/three-scene.spec.ts --grep "3D dice settles|3D simultaneous"
        env:
          CI: true
      - run: pnpm exec playwright test -c playwright.relay.config.ts --grep "browser authority 8 independent"
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
